name: taxiff
description: "Conteo de pasajeros y cronómetro de carreras en taxi con YOLO on-device."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  camera: ^0.12.0+2
  excel: ^4.0.6
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  geocoding: ^5.0.0
  geolocator: ^14.1.1
  image: ^4.3.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.12.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.2+1
  tflite_flutter: ^0.12.1
  url_launcher: ^6.3.3
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # best.tflite (modelo) y, opcionalmente, video_prueba.mp4 para el modo simulación.
  assets:
    - assets/
    - assets/fonts/
    - assets/models/

# Icono de la app: `dart run flutter_launcher_icons` (imágenes en assets/icon/).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: assets/icon/icon_background.png
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 24
